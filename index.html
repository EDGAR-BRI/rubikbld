    <!-- Datos Estructurados Schema.org / JSON-LD: FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "¿Qué es Memo Cube?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Memo Cube es una Progressive Web App (PWA) diseñada para competidores de Cubo de Rubik en la categoría 3x3 a Ciegas (3BLD), que ayuda a memorizar pares de letras mnemotécnicos mediante repetición espaciada (SRS) y visualización 3D."
            }
          },
          {
            "@type": "Question",
            "name": "¿Funciona sin conexión a internet (Offline)?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí, Memo Cube es 100% offline-first. Todos los datos, tarjetas, imágenes mnemotécnicas e historial de práctica se guardan localmente en el dispositivo utilizando IndexedDB a través de Dexie.js."
            }
          },
          {
            "@type": "Question",
            "name": "¿Qué esquema de letras utiliza para 3BLD?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Memo Cube incluye por defecto el esquema estándar internacional Speffz y permite personalizar cualquier letra de arista o esquina, además de configurar buffers personalizados con exclusión automática de piezas físicamente imposibles."
            }
          },
          {
            "@type": "Question",
            "name": "¿Cómo funciona la repetición espaciada (SRS)?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Utiliza un algoritmo derivado de SM-2 (estilo Anki) que clasifica las tarjetas en colas de Nuevas, Aprendiendo y Vencidas, calculando intervalos óptimos de repaso según la dificultad seleccionada por el usuario (Otra vez, Difícil, Bien, Fácil)."
            }
          }
        ]
      }
    </script>

      <div style="max-width: 680px; margin: 40px auto; padding: 24px; font-family: sans-serif; background-color: #090d16; color: #f1f5f9; border-radius: 16px;">
        <h1>Memo Cube — Entrenamiento 3x3 a Ciegas (3BLD)</h1>
        <p>Memo Cube es una aplicación web progresiva para memorizar y entrenar pares de letras del Cubo de Rubik con el método de Repetición Espaciada (SRS).</p>
        <h2>Características principales:</h2>
        <ul>
          <li>Repaso de pares de letras con algoritmo SRS estilo Anki.</li>
          <li>Práctica de memorización contrarreloj con generador de mezclas oficiales (scrambles).</li>
          <li>Esquema de letras Speffz interactivo en 3D.</li>
          <li>100% Offline con almacenamiento local.</li>
        </ul>
        <p>Para utilizar todas las funciones interactivas del cubo 3D y las tarjetas, por favor habilita JavaScript en tu navegador.</p>
      </div>
    </noscript>
